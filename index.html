<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alvo App">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#efe7d8">
<link rel="manifest" href="manifest.json">
<title>Alvo App</title>
<style>
  :root{
    --page-bg:#efe7d8;
    --card-bg:#ffffff;
    --ink:#2b2620;
    --ink-soft:#6b6156;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#17140f;
      --card-bg:#242019;
      --ink:#f2ece0;
      --ink-soft:#b5ab9b;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#17140f; --card-bg:#242019; --ink:#f2ece0; --ink-soft:#b5ab9b;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--page-bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 18px;
    min-height:100vh;
  }
  .wrap{ width:100%; max-width:420px; }

  header{ text-align:center; margin-bottom:28px; }
  header h1{
    margin:0;
    font-size:28px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  header p{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:14px;
  }

  .cards{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.card{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card-bg);
    border-radius:20px;
    padding:20px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    transition:transform 0.1s;
  }
  a.card:active{ transform:scale(0.98); }

  .icon{
    width:56px;
    height:56px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    flex-shrink:0;
  }
  .icon.cores{ background:linear-gradient(135deg, #f4c22b, #3fb86b, #ef5b5b, #4f8ef0); }
  .icon.humanoide{ background:#1a1a1a; }

  .text{ flex:1; }
  .text .title{ font-weight:800; font-size:17px; }
  .text .subtitle{ color:var(--ink-soft); font-size:13px; margin-top:2px; }

  .chevron{ color:var(--ink-soft); font-size:20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎯 Alvo App</h1>
    <p>Selecione a calculadora</p>
  </header>

  <div class="cards">
    <a class="card" href="alvometro.html">
      <div class="icon cores">🎯</div>
      <div class="text">
        <div class="title">Alvo 4 Cores</div>
        <div class="subtitle">Pontuação por cor + penalidades</div>
      </div>
      <div class="chevron">›</div>
    </a>

    <a class="card" href="humanoide.html">
      <div class="icon humanoide">🧍</div>
      <div class="text">
        <div class="title">Alvo Humanoide</div>
        <div class="subtitle">20 ou 10 disparos</div>
      </div>
      <div class="chevron">›</div>
    </a>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
